        - generic [ref=e134]:
          - blockquote [ref=e135]:
            - generic [ref=e136]: "\""
            - paragraph [ref=e137]: El profesionalismo y la calma de María marcan una verdadera diferencia. Practicar meditación después de su taller me ha ayudado muchísimo a ser más productiva y a ordenar mis prioridades con mayor claridad. También noto una mejor gestión del estrés en momentos de presión.
            - generic [ref=e138]:
              - strong [ref=e139]: María Aristeguieta
              - generic [ref=e140]: Talent Processes Senior Specialist at Avature, Spain
          - blockquote [ref=e141]:
            - generic [ref=e142]: "\""
            - paragraph [ref=e143]: ¡Ojalá todos pudieran asistir a este workshop! Fue increíblemente valioso experimentar el mindfulness y llevarnos herramientas concretas para aplicar en el trabajo. Salimos con más presencia, mejor escucha y una energía de equipo mucho más conectada. ¡Tu workshop es oro puro!
            - generic [ref=e144]:
              - strong [ref=e145]: Vanessa Fernández
              - generic [ref=e146]: Senior Product Manager at Giftify, Belgium
          - blockquote [ref=e147]:
            - generic [ref=e148]: "\""
            - paragraph [ref=e149]: Gracias, Maria, por enseñarme que la pausa también es parte del proceso. Tu workshop me recordó que regularnos no es frenar, sino crear espacio para decidir mejor y colaborar con más empatía. Es una experiencia que realmente transforma la forma de vivir el día a día laboral.
            - generic [ref=e150]:
              - strong [ref=e151]: Stella Camacho
              - generic [ref=e152]: Founder & Chief Creative Officer at Amorchi House
