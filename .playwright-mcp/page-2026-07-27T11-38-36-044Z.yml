          - paragraph [ref=e50]: Terapeuta transpersonal, guía de meditación y fundadora de Eleahora. Combina su carrera de idiomas (La Sorbonne) y su formación en PNL transpersonal, Mindfulness y conexión energética para llevar herramientas prácticas de neuroregulación al entorno corporativo.
